<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Will You Be My Valentine? ❤️</title>

<style>
body {
margin: 0;
height: 100vh;
font-family: "Comic Sans MS", cursive, sans-serif;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
background: linear-gradient(135deg, #ff4d6d, #ffafcc, #ffc8dd, #bde0fe);
background-size: 300% 300%;
animation: bgMove 6s infinite alternate;
}

@keyframes bgMove {
0% { background-position: 0% 50%; }
100% { background-position: 100% 50%; }
}

.container {
text-align: center;
background: rgba(255, 255, 255, 0.25);
padding: 40px;
border-radius: 25px;
box-shadow: 0 10px 30px rgba(0,0,0,0.2);
backdrop-filter: blur(10px);
max-width: 600px;
position: relative;
}

h1 {
font-size: 2.5rem;
color: #fff;
text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
}

p {
color: white;
font-size: 1.2rem;
margin-bottom: 30px;
}

.btn-group {
display: flex;
justify-content: center;
gap: 20px;
}

button {
font-size: 1.2rem;
border: none;
padding: 15px 30px;
border-radius: 15px;
cursor: pointer;
transition: 0.2s ease-in-out;
font-weight: bold;
}

#yesBtn {
background: #06d6a0;
color: white;
box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

#yesBtn:hover {
transform: scale(1.1);
background: #00b37d;
}

#noBtn {
background: #ff006e;
color: white;
position: absolute;
left: 50%;
top: 65%;
transform: translate(-50%, -50%);
box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

#noBtn:hover {
transform: translate(-50%, -50%) scale(1.05);
}

.hearts {
position: absolute;
width: 100%;
height: 100%;
overflow: hidden;
top: 0;
left: 0;
z-index: -1;
}

.heart {
position: absolute;
color: rgba(255,255,255,0.7);
font-size: 20px;
animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
0% {
transform: translateY(100vh) scale(0.5);
opacity: 0;
}
50% {
opacity: 1;
}
100% {
transform: translateY(-10vh) scale(1.2);
opacity: 0;
}
}

.popup {
display: none;
margin-top: 25px;
font-size: 1.5rem;
color: white;
font-weight: bold;
text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
animation: pop 0.5s ease;
}

@keyframes pop {
from { transform: scale(0.5); opacity: 0; }
to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container">
<h1>Will You Be My Valentine? ❤️</h1>
<p>Think carefully... because "No" is not really an option 😌💘</p>

<div class="btn-group">
<button id="yesBtn">Yes 💕</button>
</div>

<button id="noBtn">No 💔</button>

<div class="popup" id="popupMsg">
Yayyyy!! 😍❤️💍<br>
I knew you’d say YES 🥹💖
</div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const popupMsg = document.getElementById("popupMsg");

const messages = [
"Are you sure? 😏",
"Do you really wanna do this? 🥺",
"Come on babe ❤️",
"But I love you 😭",
"You're gonna make me cry 😢",
"Plssss 😩💘",
"Don't break my heart 💔",
"Say yes already 😍",
"I’ll buy you chocolates 🍫",
"Last chance 😤❤️"
];

let msgIndex = 0;

function moveButton() {
const padding = 80;

const maxX = window.innerWidth - noBtn.offsetWidth - padding;
const maxY = window.innerHeight - noBtn.offsetHeight - padding;

const randomX = Math.floor(Math.random() * maxX) + padding / 2;
const randomY = Math.floor(Math.random() * maxY) + padding / 2;

noBtn.style.left = randomX + "px";
noBtn.style.top = randomY + "px";
}

noBtn.addEventListener("mouseover", () => {
noBtn.innerText = messages[msgIndex];
msgIndex = (msgIndex + 1) % messages.length;

moveButton();
});

noBtn.addEventListener("click", () => {
moveButton();
});

yesBtn.addEventListener("click", () => {
popupMsg.style.display = "block";
noBtn.style.display = "none";
yesBtn.innerText = "Yesss ❤️😍";
yesBtn.style.background = "#ff006e";
});

// Floating hearts background
const heartsContainer = document.getElementById("hearts");

function createHeart() {
const heart = document.createElement("div");
heart.classList.add("heart");
heart.innerHTML = "❤️";

heart.style.left = Math.random() * 100 + "vw";
heart.style.fontSize = Math.random() * 25 + 15 + "px";
heart.style.animationDuration = Math.random() * 3 + 4 + "s";

heartsContainer.appendChild(heart);

setTimeout(() => {
heart.remove();
}, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
